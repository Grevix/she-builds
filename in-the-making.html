<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E4045E" />
  <title>Under Construction — SHE BUILDS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="shortcut icon" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="in-the-making.css" />
  <link rel="stylesheet" href="rotate-prompt.css" />
</head>
<body>
  <div class="under-stage">
    <!-- Top Navigation Bar (Identical to About page) -->
    <header class="about-header">
      <a href="index.html" class="brand-wordmark" aria-label="SHE BUILDS Home">
        <span class="brand-she">SHE</span>
        <span class="brand-builds">BUILDS</span>
      </a>

      <nav class="about-nav" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="program.html" class="nav-link">Program</a>
        <a href="in-the-making.html" class="nav-link active" aria-current="page">In the Making</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>

      <div class="header-action">
        <a
          href="https://grevix.online"
          class="btn-check-grevix"
          aria-label="Check GREVIX official website"
        >Check GREVIX ↗</a>
      </div>
    </header>

    <!-- Main Hero Composition -->
    <main class="under-hero" aria-label="Under Construction Notice">
      <!-- 1. Construction Cone Icon & Animated Progress Bar -->
      <div class="status-indicator">
        <!-- Crisp Pixel/Monochrome Construction Cone with Sparkles -->
        <div class="cone-wrap" aria-hidden="true">
          <svg class="cone-svg" viewBox="0 0 110 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Sparkle -->
            <line x1="19" y1="19" x2="19" y2="29" stroke="#FFFFFF" stroke-width="1.5"/>
            <line x1="14" y1="24" x2="24" y2="24" stroke="#FFFFFF" stroke-width="1.5"/>
            <rect x="18" y="23" width="2" height="2" fill="#FFFFFF"/>

            <!-- Right Sparkle -->
            <line x1="92" y1="31" x2="92" y2="41" stroke="#FFFFFF" stroke-width="1.5"/>
            <line x1="87" y1="36" x2="97" y2="36" stroke="#FFFFFF" stroke-width="1.5"/>
            <rect x="91" y="35" width="2" height="2" fill="#FFFFFF"/>

            <!-- Cone Top Cap -->
            <path d="M50.5 10C50.5 5 52.5 3 55 3C57.5 3 59.5 5 59.5 10" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>

            <!-- Cone Upper Sides -->
            <line x1="50.5" y1="10" x2="47.5" y2="17" stroke="#FFFFFF" stroke-width="1.5"/>
            <line x1="59.5" y1="10" x2="62.5" y2="17" stroke="#FFFFFF" stroke-width="1.5"/>

            <!-- Top Solid White Stripe -->
            <polygon points="47,17 63,17 65.5,24 44.5,24" fill="#FFFFFF"/>

            <!-- Cone Middle Sides -->
            <line x1="44.5" y1="24" x2="42.5" y2="31" stroke="#FFFFFF" stroke-width="1.5"/>
            <line x1="65.5" y1="24" x2="67.5" y2="31" stroke="#FFFFFF" stroke-width="1.5"/>

            <!-- Bottom Solid White Stripe -->
            <polygon points="42,31 68,31 71,39 39,39" fill="#FFFFFF"/>

            <!-- Cone Lower Sides -->
            <line x1="39" y1="39" x2="37.5" y2="44" stroke="#FFFFFF" stroke-width="1.5"/>
            <line x1="71" y1="39" x2="72.5" y2="44" stroke="#FFFFFF" stroke-width="1.5"/>

            <!-- Base Plate (Crisp Outlined Bar) -->
            <rect x="32" y="44" width="46" height="4" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
          </svg>
        </div>

        <!-- 2. Real Functional Animated Progress Bar -->
        <div
          class="progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Launch preparation progress"
          id="constructionProgressBar"
        >
          <div class="progress-fill" id="constructionProgressFill"></div>
        </div>
      </div>

      <!-- 3. Headline: UNDER CONSTRUCTION -->
      <h1 class="under-headline">
        <span class="headline-under">UNDER</span>
        <span class="headline-construction">CONSTRUCTION</span>
      </h1>

      <!-- 4. Launch-Date Note -->
      <p class="launch-note">
        SHE BUILDS begins December 1, 2026.
      </p>
    </main>
  </div>

  <script src="in-the-making.js"></script>
  <script src="rotate-prompt.js"></script>
</body>
</html>
